spring.application.name=rest-api-demo
#Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/comercio_api_rest
spring.datasource.username=root
# La contrasena se toma de la variable de entorno DB_PASSWORD.
# VS Code la inyecta desde .vscode/launch.json (fichero ignorado por git).
# Desde terminal:  DB_PASSWORD='...' ./mvnw spring-boot:run
# OJO: si la variable no esta definida, MySQL responde 'Access denied',
# no un error de placeholder. Ese es el sintoma de haberla olvidado.
spring.datasource.password=${DB_PASSWORD}

# Para configurar el ORM Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# La siguiente clave (key) ofrece mas informacion por la consola respecto a las consultas
# o sentencias del SQL generadas por HIBERNATE
spring.jpa.properties.hibernate.format_sql=true
# <=========== gracias a SuperJuli =============>
spring.jackson.deserialization.fail-on-null-for-primitives=false